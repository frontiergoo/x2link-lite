{% extends 'links/base.html' %}{% block content %}<h1>キャンペーン</h1><p>目的と期間を添えて、施策ごとにリンクをまとめます。</p><section class="panel">{% for campaign in campaigns %}<h2><a href="{% url 'campaign_detail' campaign.pk %}">{{ campaign.name }}</a></h2><p>{{ campaign.purpose }}</p>{% empty %}<p>まだキャンペーンがありません。</p>{% endfor %}</section><section class="panel"><h2>キャンペーンを作成</h2><form method="post">{% csrf_token %}{{ form.as_p }}<button class="primary">作成する</button></form></section>{% endblock %}
