# ドメイン名・証明書パス・静的ファイルパスを実環境に合わせて設定する。
limit_req_zone $binary_remote_addr zone=x2link_public:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=x2link_login:10m rate=5r/m;
log_format x2link_minimal '$status $request_time';

server {
    listen 443 ssl;
    server_name admin.example.com;
    ssl_certificate /etc/ssl/x2link/admin/fullchain.pem;
    ssl_certificate_key /etc/ssl/x2link/admin/privkey.pem;
    client_max_body_size 256k;
    access_log /var/log/nginx/x2link-admin.log x2link_minimal;
    location /static/ {
        alias /srv/x2link/static/;
    }
    location = /manage/login/ {
        limit_req zone=x2link_login burst=5 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
}

server {
    listen 443 ssl;
    server_name go.example.com;
    ssl_certificate /etc/ssl/x2link/public/fullchain.pem;
    ssl_certificate_key /etc/ssl/x2link/public/privkey.pem;
    client_max_body_size 1k;
    access_log /var/log/nginx/x2link-public.log x2link_minimal;
    location /static/ {
        alias /srv/x2link/static/;
    }
    location /manage {
        return 404;
    }
    location / {
        limit_req zone=x2link_public burst=40 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
}
